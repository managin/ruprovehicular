<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Planilla Control Diario Vehicular</title>

<style>
:root{
  --bg:#ffffff;
  --muted:#6b7280;
  --accent:#0b74de;
  --border:#e5e7eb;
  --card:#f9fafb;
}

body{
  font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial;
  background:var(--bg);
  color:#0f172a;
  margin:18px;
}

.container{
  max-width:900px;
  margin:0 auto;
  display:none;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

h1{
  font-size:20px;
  margin:0;
}

.small{
  font-size:13px;
  color:var(--muted);
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:8px;
  padding:12px;
  margin-bottom:14px;
}

label{
  font-size:13px;
}

input[type="text"],
input[type="date"],
input[type="time"],
input[type="number"],
select,
textarea{
  width:100%;
  padding:8px;
  border:1px solid var(--border);
  border-radius:6px;
  font-size:14px;
  box-sizing:border-box;
}

textarea{
  min-height:70px;
}

.field-row{
  display:flex;
  gap:8px;
}

.field-row > *{
  flex:1;
}

.row{
  display:flex;
  gap:8px;
}

.toolbar{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-bottom:10px;
}

.btn{
  background:var(--accent);
  color:#fff;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}

.btn.secondary{
  background:#eef2ff;
  color:#0b3a80;
}

.btn.ghost{
  background:transparent;
  border:1px solid var(--border);
  color:#0f172a;
}

/* Gauge */

.gauge{
  width:220px;
  height:120px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

svg .needle{
  transform-origin:50% 88%;
  transition:transform 1.2s cubic-bezier(.22,.61,.36,1);
}

.pct-text{
  position:absolute;
  left:50%;
  top:46%;
  transform:translate(-50%,-50%);
  font-weight:700;
  font-size:16px;
}

.gauge-legend{
  font-size:12px;
  color:var(--muted);
}

.fuel-controls{
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:6px;
}

.fuel-controls input[type="range"]{
  flex:1;
}

.fuel-controls input[type="number"]{
  width:70px;
}

.signature{
  margin-top:14px;
  font-size:14px;
}

/* login */

#loginBox{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:90vh;
}

#loginBox input{
  width:220px;
  margin:6px 0;
}

#loginBox button{
  margin-top:8px;
}

/* responsive */

@media(max-width:760px){
  .field-row{
    flex-direction:column;
  }

  .gauge{
    width:180px;
    height:100px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginBox">
  <h2>Acceso restringido</h2>

  <input type="text" id="user" placeholder="Usuario">
  <input type="password" id="pass" placeholder="Contraseña">

  <button class="btn" id="loginBtn">Ingresar</button>

  <p id="msg" style="color:red"></p>
</div>

<!-- CONTENIDO -->

<div class="container" id="main">

<header>
  <div>
    <h1>Planilla Control Diario Vehicular</h1>
    <div class="small">
      Completar y exportar PDF o CSV
    </div>
  </div>
</header>

<div class="toolbar">
  <button class="btn secondary" id="addBtn">Agregar otro</button>
  <button class="btn ghost" id="resetBtn">Reset</button>
  <button class="btn" id="exportPdf">Exportar PDF</button>
  <button class="btn" id="exportCsv">Exportar CSV</button>
</div>

<form id="forms">

<template id="tpl">

<section class="card record">

<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">

<div style="flex:1;min-width:300px;">

<div class="field-row">

<div>
<label>Fecha</label>
<input type="date" name="fecha">
</div>

<div>
<label>Patente</label>
<input type="text" name="patente" placeholder="ABC123">
</div>

</div>

<div style="margin-top:8px">
<label class="small">Limpieza</label>

<div class="row" style="margin-top:6px">
<label><input type="radio" name="limpieza" value="Sí"> Sí</label>
<label><input type="radio" name="limpieza" value="No"> No</label>
</div>
</div>

<div style="margin-top:8px">

<div class="field-row">

<div>
<label>Aceite</label>
<select name="aceite">
<option>OK</option>
<option>Revisar</option>
</select>
</div>

<div>
<label>Agua</label>
<select name="agua">
<option>OK</option>
<option>Revisar</option>
</select>
</div>

</div>

</div>

<div style="margin-top:8px" class="field-row">

<div>
<label>Km recibido</label>
<input type="number" name="km_recibido">
</div>

<div>
<label>Km entrega</label>
<input type="number" name="km_entrega">
</div>

</div>

<!-- NUEVOS CAMPOS -->

<div style="margin-top:8px" class="field-row">

<div>
<label>Lugar</label>
<input type="text" name="lugar">
</div>

<div>
<label>Sector</label>
<input type="text" name="sector">
</div>

</div>

<div style="margin-top:8px" class="field-row">

<div>
<label>Hora salida</label>
<input type="time" name="hora_salida">
</div>

<div>
<label>Hora llegada</label>
<input type="time" name="hora_llegada">
</div>

</div>

<div style="margin-top:8px">
<label>Novedades</label>
<textarea name="novedades"></textarea>
</div>

<!-- IMAGEN -->

<div style="margin-top:10px;text-align:center;">
  <img 
    src="responsabilidad.png"
    style="
      width:100%;
      max-width:420px;
      height:auto;
      opacity:0.92;
      border-radius:8px;
    "
  >
</div>

<div class="signature">
Firma Chofer: ________________________
</div>

</div>

<!-- GAUGE -->

<div style="width:240px;text-align:center">

<div class="gauge">

<svg viewBox="0 0 200 110" width="200" height="110">

<path d="M10,100 A90,90 0 0,1 190,100"
fill="none"
stroke="#e6edf5"
stroke-width="18"
stroke-linecap="round"/>

<path d="M20,100 A80,80 0 0,1 180,100"
fill="none"
stroke="#dbe7fb"
stroke-width="10"
stroke-linecap="round"/>

<g class="ticks"></g>

<line
class="needle"
x1="100"
y1="100"
x2="100"
y2="24"
stroke="#c53030"
stroke-width="3"
stroke-linecap="round"
/>

<circle cx="100" cy="100" r="5" fill="#111"/>

</svg>

<div class="pct-text">50%</div>

</div>

<div style="margin-top:6px;text-align:left">

<label class="small">Nivel combustible</label>

<div class="fuel-controls">

<input type="range"
min="0"
max="100"
value="50"
class="fuel-range">

<input type="number"
min="0"
max="100"
value="50"
class="fuel-number">

</div>

<div class="gauge-legend">
<span>E</span>
<span style="float:right">F</span>
</div>

</div>

</div>

</div>

<div style="display:flex;justify-content:flex-end;margin-top:8px">
<button type="button" class="btn ghost remove">Eliminar</button>
</div>

</section>

</template>

<div id="list"></div>

</form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>

/* LOGIN */

document.getElementById('loginBtn').addEventListener('click',function(){

const user=document.getElementById('user').value;
const pass=document.getElementById('pass').value;

if(user==="admin" && pass==="1234"){
document.getElementById('loginBox').style.display='none';
document.getElementById('main').style.display='block';
}else{
document.getElementById('msg').innerText='Credenciales incorrectas';
}

});

/* TICKS */

function makeTicks(svg){

const g=svg.querySelector('.ticks');

for(let i=0;i<=12;i++){

let a=-90+(i/12)*180;

let rOut=80;
let rIn=(i%3===0)?60:68;

let x1=100+rOut*Math.cos(a*Math.PI/180);
let y1=100+rOut*Math.sin(a*Math.PI/180);

let x2=100+rIn*Math.cos(a*Math.PI/180);
let y2=100+rIn*Math.sin(a*Math.PI/180);

const line=document.createElementNS("http://www.w3.org/2000/svg","line");

line.setAttribute('x1',x1);
line.setAttribute('y1',y1);
line.setAttribute('x2',x2);
line.setAttribute('y2',y2);

line.setAttribute('stroke','#9aa7bf');
line.setAttribute('stroke-width','2');

g.appendChild(line);

}

}

/* GAUGE */

function attachGauge(section){

const svg=section.querySelector('svg');

if(!svg.dataset.ready){
makeTicks(svg);
svg.dataset.ready='1';
}

const range=section.querySelector('.fuel-range');
const number=section.querySelector('.fuel-number');
const needle=section.querySelector('.needle');
const pct=section.querySelector('.pct-text');

function setVal(v){

v=parseInt(v);

if(isNaN(v))v=0;

if(v<0)v=0;
if(v>100)v=100;

const angle=-90+(v/100)*180;

needle.style.transform=`rotate(${angle}deg)`;

pct.innerText=v+'%';

range.value=v;
number.value=v;

}

range.addEventListener('input',()=>setVal(range.value));

number.addEventListener('input',()=>setVal(number.value));

setVal(50);

}

/* RECORDS */

const tpl=document.getElementById('tpl');
const list=document.getElementById('list');

let counter=0;

function addRecord(){

counter++;

const node=tpl.content.cloneNode(true);

list.appendChild(node);

const last=list.lastElementChild;

attachGauge(last);

last.querySelector('.remove').addEventListener('click',()=>{
last.remove();
});

}

document.getElementById('addBtn').addEventListener('click',addRecord);

addRecord();

/* RESET */

document.getElementById('resetBtn').addEventListener('click',()=>{

list.innerHTML='';
addRecord();

});

/* PDF */

document.getElementById('exportPdf').addEventListener('click',()=>{

const opt={
margin:0.3,
filename:'planilla.pdf',
image:{type:'jpeg',quality:0.98},
html2canvas:{scale:2},
jsPDF:{unit:'in',format:'a4',orientation:'portrait'}
};

html2pdf().set(opt).from(document.getElementById('main')).save();

});

/* CSV */

document.getElementById('exportCsv').addEventListener('click',()=>{

let csv='';

document.querySelectorAll('.record').forEach(rec=>{

const vals=[];

rec.querySelectorAll('input, textarea, select').forEach(el=>{
vals.push('"' + el.value + '"');
});

csv+=vals.join(',')+'\n';

});

const blob=new Blob([csv],{type:'text/csv'});

const a=document.createElement('a');

a.href=URL.createObjectURL(blob);

a.download='planilla.csv';

a.click();

});

</script>

</body>
</html>
